<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>前置詞ラボ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="前置詞ラボ">
<meta name="theme-color" content="#141B23">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column; dark lab bench with cream study cards (series look); core diagrams sit on a bright white plate so the shapes read clearly */
:root{
  --bg:#1E2733; --bg-deep:#121820;
  --card:#F6F0E1; --card-2:#EDE5D1; --ink:#221E16; --ink-soft:#6B6355; --line:#DED2B8;
  --plate:#FFFFFF; --plate-line:#E4E1DA;
  --cream:#F3ECD9; --cream-soft:rgba(243,236,217,.62); --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.14);
  --mustard:#E2A93B; --mint:#3F8F74; --coral:#D9503A; --indigo:#4C5FD5;
  --f-en:'Fraunces', Georgia, 'Times New Roman', serif;
  --f-ja:'Zen Kaku Gothic New', -apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{margin:0;background:var(--bg-deep);background-image:radial-gradient(120% 90% at 50% -10%, var(--bg) 0%, var(--bg-deep) 100%);background-attachment:fixed;color:var(--cream);font-family:var(--f-ja);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
#app{max-width:460px;margin:0 auto;padding:14px 16px 48px;display:flex;flex-direction:column;gap:14px}

/* header */
.hero{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 2px 4px}
.hero h1{margin:0;font-weight:900;font-size:1.75rem;letter-spacing:.04em;line-height:1.2}
.hero .sub{margin:4px 0 0;font-family:var(--f-en);font-size:.82rem;color:var(--cream-soft);letter-spacing:.02em}
.gear{background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;width:40px;height:40px;font-size:1.1rem;color:var(--cream)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:8px 16px;margin:0 -16px;background:var(--bg-deep);background:linear-gradient(var(--bg-deep) 70%, transparent)}
.back{background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;width:38px;height:38px;flex:none;color:var(--cream);font-size:1.05rem}
.bar-t{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-s{font-size:.75rem;color:var(--cream-soft);white-space:nowrap}
.bar-s b{color:var(--mustard);font-size:1rem;font-variant-numeric:tabular-nums}

.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.12em;color:var(--ink-soft)}
.h{margin:10px 2px 0;font-size:.78rem;font-weight:700;letter-spacing:.14em;color:var(--cream-soft)}
.muted{color:var(--ink-soft);font-size:.85rem;margin:6px 0 0}
.lead{margin:0;font-size:.9rem;color:var(--cream-soft)}
.card .lead,.card .muted{color:var(--ink-soft)}
.note-s{margin:-4px 2px 0;font-size:.75rem;color:var(--cream-soft)}

/* chips & stamps */
.chips{display:inline-flex;flex-wrap:wrap;gap:5px;vertical-align:middle}
.chip{font-family:var(--f-en);font-weight:600;font-size:.8rem;line-height:1;padding:5px 9px 6px;border-radius:999px;background:var(--c);color:#fff}
.stamp{display:inline-grid;place-items:center;width:46px;height:46px;border:2.5px solid var(--coral);border-radius:50%;color:var(--coral);font-weight:900;font-size:.82rem;letter-spacing:.06em;transform:rotate(-12deg);flex:none;background:rgba(217,80,58,.06)}
.stamp.big{width:96px;height:96px;font-size:1.6rem;border-width:4px}
.tag{font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(226,169,59,.18);color:var(--mustard);white-space:nowrap;flex:none}
.tag.dim{background:var(--glass);color:var(--cream-soft)}
.card .tag{background:var(--card-2);color:var(--ink)}

/* home blocks */
.cont{display:block;width:100%;text-align:left;border:0;border-radius:20px;background:var(--card);color:var(--ink);padding:18px 18px 16px;box-shadow:0 16px 36px rgba(0,0,0,.35);position:relative}
.cont-t{font-weight:900;font-size:1.15rem;margin:4px 0 6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cont-s{font-size:.88rem;color:var(--ink-soft)}
.meter{height:6px;border-radius:6px;background:var(--card-2);margin:12px 0 4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--coral);border-radius:6px}
.go{position:absolute;right:16px;top:16px;font-size:.8rem;font-weight:700;color:var(--coral)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:14px 16px;color:var(--cream);min-height:54px}
.row:disabled{opacity:.55}
.row-t{font-weight:700;min-width:0}
.row-v{font-size:.85rem;color:var(--cream-soft);text-align:right;white-space:nowrap}
.row-v b{color:var(--mustard);font-size:1.1rem;font-variant-numeric:tabular-nums}
.row-v small{display:block;font-size:.7rem}
.toc{display:flex;flex-direction:column;gap:10px}
.grp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:14px;color:var(--cream)}
.grp-n{font-family:var(--f-en);font-weight:700;font-size:1.4rem;color:var(--cream-soft);width:22px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.grp-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.grp-t{font-weight:700}
.grp-s{font-size:.75rem;color:var(--cream-soft)}
.grp .stamp{width:42px;height:42px;font-size:.75rem;background:transparent;border-color:#F07A62;color:#F07A62}
.final{display:block;width:100%;text-align:left;border:1.5px dashed rgba(226,169,59,.55);border-radius:18px;background:rgba(226,169,59,.08);color:var(--cream);padding:16px 18px}
.final:disabled{opacity:.55}
.final .eyebrow{color:var(--mustard)}
.fin-t{font-weight:900;font-size:1.05rem;margin:4px 0 2px}
.fin-s{font-size:.8rem;color:var(--cream-soft)}
.passline{display:flex;align-items:center;gap:12px;margin:0;color:var(--cream-soft);font-size:.88rem}

/* study card */
.card{background:var(--card);color:var(--ink);border-radius:20px;padding:18px;box-shadow:0 16px 36px rgba(0,0,0,.35)}
.core{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:var(--card);color:var(--ink);border-radius:20px;padding:20px 18px;box-shadow:0 16px 36px rgba(0,0,0,.35)}
.core-w{font-family:var(--f-en);font-weight:700;font-size:3.4rem;line-height:1;color:var(--c);letter-spacing:-.01em}
.core-s{font-weight:900;font-size:1.05rem;margin-bottom:6px}
.core-l{text-align:left;margin:8px 0 0;font-size:.92rem;line-height:1.85;max-width:36em}

/* diagram plate */
.dg{background:var(--plate);border:1px solid var(--plate-line);border-radius:16px;position:relative;overflow:hidden;cursor:pointer;flex:none}
.dg svg{display:block;width:100%;height:auto}
.dg.big{width:100%;max-width:360px;box-shadow:inset 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent)}
.dg.mini{width:112px;border-radius:12px}
.dg.tile{width:100%;border-radius:10px;border:0}
.dg-hint{position:absolute;right:10px;bottom:6px;font-size:.66rem;color:#8B909B}

.card-top{display:flex;justify-content:space-between;align-items:center}
.cnt{font-size:.75rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sent{font-family:var(--f-en);font-weight:500;font-size:1.3rem;line-height:1.5;margin:14px 0 6px;text-wrap:balance}
.sent.big{font-size:1.4rem}
.hl{color:var(--c);font-weight:700}
.card .hl{color:var(--c)}
.blank{display:inline-block;width:3.2em;height:1.05em;border-bottom:3px solid var(--ink);vertical-align:-.1em;margin:0 .1em}
.tfw{text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-color:var(--coral);font-weight:700}
.pv-ph{font-family:var(--f-en);font-weight:700;font-size:2rem;margin-top:12px;line-height:1.2}
.prompt{margin:10px 0 0;font-size:.8rem;color:var(--ink-soft)}
.deck{cursor:pointer;min-height:220px}
.deck.open{cursor:default}
.back-face{border-top:1.5px dashed var(--line);margin-top:16px;padding-top:14px;display:flex;flex-direction:column;gap:10px}
.mean{font-weight:900;font-size:1.25rem}
.ja{margin:0;font-size:1.02rem;font-weight:500}
.why-wrap{display:flex;gap:12px;align-items:flex-start}
.why{margin:0;font-size:.88rem;line-height:1.75;min-width:0;flex:1}
.why .hl{font-family:var(--f-en);font-size:1rem}
.say-row{display:flex}
.say{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.95rem;line-height:1;flex:none}
.say span{font-size:.75rem;font-weight:700}

.cmp{background:var(--card-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cmp-h{font-size:.72rem;font-weight:900;letter-spacing:.12em;color:var(--ink-soft)}
.cmp-i{display:flex;flex-direction:column;gap:2px}
.cmp-i + .cmp-i{border-top:1px dashed var(--line);padding-top:10px}
.cmp-en{font-family:var(--f-en);font-size:1.02rem;line-height:1.45}
.cmp-ja{font-size:.84rem;line-height:1.7}

/* quiz */
.qmeta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--cream-soft);padding:0 4px;font-variant-numeric:tabular-nums}
.qja{margin:4px 0 0;font-size:.9rem;color:var(--ink-soft)}
.choices{display:grid;gap:10px}
.choices.n2{grid-template-columns:1fr 1fr}
.choices.n3{grid-template-columns:repeat(3,1fr)}
.choices.n4{grid-template-columns:1fr 1fr}
.choice{border:0;border-radius:14px;background:var(--card);color:var(--ink);font-family:var(--f-en);font-weight:600;font-size:1.2rem;padding:16px 6px;box-shadow:inset 0 -4px 0 var(--card-2), 0 6px 14px rgba(0,0,0,.25);border-top:4px solid var(--c);min-height:60px}
.choice.tf{font-family:var(--f-ja);font-size:1rem;font-weight:700;border-top-color:var(--card-2)}
.choice:disabled{opacity:.55}
.choice.is-ok{opacity:1;background:var(--mint);color:#fff;box-shadow:none}
.choice.is-ng{opacity:1;background:var(--coral);color:#fff;box-shadow:none}
.step2{display:flex;flex-direction:column;gap:8px}
.step2 .eyebrow{color:var(--cream-soft);padding-left:4px}
.fb{background:var(--card);color:var(--ink);border-radius:20px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;border-left:6px solid var(--mint);scroll-margin-top:64px}
.fb.ng{border-left-color:var(--coral)}
.verdict{font-weight:900;font-size:1.2rem;color:var(--mint)}
.fb.ng .verdict{color:var(--coral)}
.note{margin:-6px 0 0;font-size:.88rem;font-weight:500}
.fb-sent{display:flex;align-items:center;gap:10px;justify-content:space-between}
.fb-sent .sent{margin:0;font-size:1.15rem;min-width:0}

/* buttons */
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:1rem;background:var(--glass);border:1px solid var(--glass-line);color:var(--cream);width:100%}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 8px 18px rgba(217,80,58,.35)}
.card .btn:not(.primary):not(.ok):not(.ng){background:var(--card-2);border-color:var(--line);color:var(--ink)}
.btn.ok{background:var(--mint);border-color:var(--mint);color:#fff}
.btn.ng{background:transparent;border:1.5px solid #E58B79;color:#F2A796}
.card .btn.ng{color:var(--coral);border-color:var(--coral)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:.85rem;width:auto}
.evals{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* results */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 18px}
.score-n{font-family:var(--f-en);font-weight:700;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.score-n small{font-size:1.2rem;margin-left:2px}
.score-s{font-size:.85rem;color:var(--ink-soft);margin-top:6px}
.passbig{display:flex;flex-direction:column;align-items:center;gap:10px}
.passbig p{margin:0;font-size:.88rem;color:var(--ink-soft)}
.end-t{margin:2px 0 4px;font-size:1.3rem;font-weight:900}
.time{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.newbest{margin:0;font-weight:900;color:var(--coral)}

/* dex */
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:center;border-radius:14px;padding:8px 8px 10px;font-family:var(--f-en);font-weight:600;font-size:.95rem}
.tile.on{background:var(--card);color:var(--c);border:0;border-top:4px solid var(--c)}
.tile.off{background:var(--glass);border:1px dashed var(--glass-line);color:var(--cream-soft);justify-content:center;min-height:96px}
.lock{font-size:1.4rem;opacity:.5}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .core{width:100%;max-width:420px;max-height:90vh;overflow:auto}

/* settings */
.set{display:flex;flex-direction:column;gap:10px}
.set textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:.72rem;padding:10px;resize:vertical}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.88rem;font-weight:700}

/* toast & confetti */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--cream);border:1px solid var(--glass-line);padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:700;transition:.25s;z-index:40;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.big{top:30%;bottom:auto;border-radius:20px;padding:18px 26px;background:var(--mustard);color:var(--ink);text-align:center;font-size:1rem}
.toast.big b{display:block;font-size:1.5rem;font-weight:900}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@media (max-width:360px){ .choices.n3{grid-template-columns:1fr 1fr 1fr} .choice{font-size:1.05rem} .dex{grid-template-columns:repeat(2,1fr)} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
/* ===== 前置詞データ ===== */
const PREPS = {
  "in": {
    color: "#E0533D", core: "中に入っている",
    coreLong: "入れ物や区切られた範囲の「中」にすっぽり入っているイメージ。箱の中だけでなく、町や国のような広い範囲、年・月・季節のような長い時間の「枠」の中にも使う。",
    uses: [
      { en: "There is a cat in the box.", ja: "箱の中にネコがいる。", why: "箱という入れ物の「中」。", cmp: [{ en: "There is a cat on the box.", p: "on", ja: "箱の「上（ふた）」にくっついている。中に入っているなら in。" }] },
      { en: "I live in Tokyo.", ja: "私は東京に住んでいる。", why: "東京という広い範囲の「中」に住んでいる。" },
      { en: "I was born in 2011.", ja: "私は2011年に生まれた。", why: "1年という長い時間の「枠」の中。月・季節も in（in May / in winter）。" },
      { en: "I get up early in the morning.", ja: "私は朝早く起きる。", why: "朝という時間帯の「枠」の中。in the afternoon / in the evening も同じ。", cmp: [{ en: "I get up early on Sunday morning.", p: "on", ja: "「日曜日の」朝のように特定の日がつくと、その日に乗る on になる。" }] },
      { en: "Please say it in English.", ja: "それを英語で言ってください。", why: "英語という言葉の「枠」の中で表す →「〜で（言語）」。" }
    ],
    pvs: [
      { ph: "come in", part: "in", en: "Come in, please.", ja: "どうぞ入ってください。", mean: "入る", why: "外から部屋の「中」へ入ってくる。" },
      { ph: "fill in", part: "in", en: "Please fill in this form.", ja: "この用紙に記入してください。", mean: "記入する", why: "空欄の「中」を文字で満たす（fill）→ 記入する。" }
    ]
  },
  "on": {
    color: "#2F6FD6", core: "面にくっついている（接触）",
    coreLong: "面に「くっついている（接触）」イメージ。上に乗っているときだけでなく、壁や天井でも、面に接していれば on。曜日や日付も「その日にピタッと乗る」と考える。",
    uses: [
      { en: "The book is on the desk.", ja: "本は机の上にある。", why: "本が机の面に「くっついて」いる。" },
      { en: "There is a picture on the wall.", ja: "壁に絵がかかっている。", why: "上でなくても、壁の面に接していれば on。", cmp: [{ en: "There is a safe in the wall.", p: "in", ja: "壁の「中」に埋めこまれた金庫。表面にくっついているなら on。" }] },
      { en: "I play tennis on Sundays.", ja: "私は日曜日にテニスをする。", why: "カレンダーの「日」にピタッと乗る。曜日・日付は on。" },
      { en: "I watched the game on TV.", ja: "テレビでその試合を見た。", why: "番組がテレビの画面・電波に「乗っている」。" },
      { en: "The light is on.", ja: "電気がついている。", why: "スイッチが「接触」して電気がつながっている状態。反対は off。" }
    ],
    pvs: [
      { ph: "put on", part: "on", en: "Put on your coat.", ja: "コートを着なさい。", mean: "身につける・着る", why: "服を体に「くっつける」（接触）→ 身につける。" },
      { ph: "turn on", part: "on", en: "Turn on the light.", ja: "電気をつけて。", mean: "（電気などを）つける", why: "スイッチを回して回路を「接触」させ、電気をつなぐ。" },
      { ph: "go on", part: "on", en: "Please go on.", ja: "続けてください。", mean: "続ける", why: "くっついたまま離れずに進んでいく →「続く」。" }
    ]
  },
  "at": {
    color: "#C98A0C", core: "ピンポイントの一点",
    coreLong: "地図にピンを刺すような「一点」のイメージ。場所を点としてとらえたり、時計が指す時刻や、視線・動作を向ける的（まと）を示したりする。",
    uses: [
      { en: "I'll meet you at the station.", ja: "駅で会おう。", why: "駅を待ち合わせの「一点」としてとらえる。", cmp: [{ en: "I'll wait for you in the station.", p: "in", ja: "駅の「建物の中で」待つ。中にいることを意識している。" }, { en: "We played in the park.", p: "in", ja: "公園の敷地の「中」で遊んだ。広さのある空間としてとらえる。" }, { en: "I'm at the park now.", p: "at", ja: "いま公園という「地点」にいる。居場所を地図上の一点として伝える。" }] },
      { en: "School starts at 8:30.", ja: "学校は8時30分に始まる。", why: "時計の針が指す「一点」の時刻。", cmp: [{ en: "School starts around 8:30.", p: "around", ja: "8時30分「ごろ」。ちょうどの一点ではなく、そのまわり。" }] },

/* 9グループの順番（位置 → 時間 → 方向 → 動き → 上下 → 離れる → 関係） */
const GROUPS = [GROUPS_BASE[0], G_TIME, G_DIR, GROUPS_BASE[1], G_UPDOWN, G_OFF, G_BY, G_OF, G_REL];

/* ===== 基本 ===== */
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const app = document.getElementById('app');
const KEY = 'zenchishi-lab-v1';
const PASS = 0.8;
let STREAK = 0;

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function dstr(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today(){ return dstr(new Date()); }
function tomorrow(){ const d = new Date(); d.setDate(d.getDate() + 1); return dstr(d); }
function col(p){ return PREPS[p] ? PREPS[p].color : '#8A8F99'; }
function fmtTime(ms){ const s = Math.round(ms / 1000); return Math.floor(s / 60) + '分' + String(s % 60).padStart(2, '0') + '秒'; }

/* ===== 保存 ===== */
function fresh(){ return { ver: 1, pos: { g: 0, s: 0 }, grp: {}, weak: {}, best: { full: null, try: null } }; }
function load(){ try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); return Object.assign(fresh(), o); } } catch (e) {} return fresh(); }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function G(id){
  if (!S.grp[id]) S.grp[id] = { passed: false, best: 0, mixDone: false, pvqDone: false, done: false };
  const r = S.grp[id];
  if (r.pvqDone === undefined) { r.pvqDone = !!r.done; if (r.passed && !r.pvqDone) r.passed = false; }
  return r;
}
/* 合格＝混合問題で8割以上 ＋ 句動詞チェックを最後まで終える（句動詞チェックがないグループは混合問題だけ） */
function gDone(g){ const r = G(g.id); return g.pvq.length ? r.pvqDone : r.mixDone; }
function checkPass(g){
  const r = G(g.id);
  if (!r.passed && r.best >= PASS && (r.pvqDone || !g.pvq.length)) { r.passed = true; save(); return true; }
  return false;
}
function passBig(g){ return '<div class="passbig"><span class="stamp big">合格</span><p>コア図図鑑に ' + g.preps.join(' / ') + ' が加わりました</p></div>'; }

/* ===== 索引 ===== */
const QIDX = {};
GROUPS.forEach((g, gi) => {
  g.mix.forEach(q => { q.g = gi; q.kind = 'mix'; if (!q.type) q.type = 'fill'; QIDX[q.id] = q; });
  g.pvq.forEach(q => { q.g = gi; q.kind = 'pvq'; q.type = 'fill'; QIDX[q.id] = q; });
});
function hasPv(g){ return g.preps.some(p => PREPS[p].pvs.length); }
function stepsOf(g){
  const st = [];
  g.preps.forEach(p => { st.push({ k: 'core', p }); st.push({ k: 'use', p }); });
  st.push({ k: 'mix' });
  if (hasPv(g)) st.push({ k: 'pv' });
  if (g.pvq.length) st.push({ k: 'pvq' });
  st.push({ k: 'end' });
  return st;
}
function stepLabel(st){
  return { core: st.p + ' のコアイメージ', use: st.p + ' の用法', mix: '混合問題', pv: '句動詞', pvq: '句動詞チェック', end: 'まとめ' }[st.k];
}
function cardData(c){ return c.kind === 'use' ? PREPS[c.p].uses[c.i] : PREPS[c.p].pvs[c.i]; }

/* ===== 苦手リスト ===== */
function addWeak(id){ S.weak[id] = { streak: 0, due: tomorrow() }; save(); }
function weakIds(){ return Object.keys(S.weak); }
function weakDue(){ const t = today(); return weakIds().filter(id => S.weak[id].due <= t); }
function updWeak(id, ok){
  const w = S.weak[id]; if (!w) return false;

/* ===== コア図アニメーション ===== */
const NS = 'http://www.w3.org/2000/svg';
const INK = '#1D2230', FAINT = '#B9BFCB';
function E(tag, a, par){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (par) par.appendChild(e); return e; }
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const seg = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
const SW = { stroke: INK, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', fill: 'none' };
const DASH = { stroke: FAINT, 'stroke-width': 2, 'stroke-dasharray': '4 5', fill: 'none' };
const SCENES = {
  in(s, c){
    const fill = E('rect', { x: 60, y: 30, width: 80, height: 80, fill: c, opacity: 0 }, s);
    E('path', Object.assign({ d: 'M60 58 V30 H140 V110 H60 V86' }, SW), s);
    E('line', Object.assign({ x1: 22, y1: 72, x2: 100, y2: 72 }, DASH), s);
    const b = E('circle', { r: 11, cx: 22, cy: 72, fill: c }, s);
    return t => { b.setAttribute('cx', 22 + 78 * ease(seg(t, 0, .7))); fill.setAttribute('opacity', seg(t, .5, .85) * .22); };
  },
  on(s, c){
    E('line', Object.assign({ x1: 28, y1: 100, x2: 148, y2: 100 }, SW), s);
    E('line', Object.assign({ x1: 174, y1: 18, x2: 174, y2: 114 }, SW), s);
    const h1 = E('line', { x1: 78, y1: 100, x2: 102, y2: 100, stroke: c, 'stroke-width': 9, 'stroke-linecap': 'round', opacity: 0 }, s);
    const h2 = E('line', { x1: 174, y1: 44, x2: 174, y2: 66, stroke: c, 'stroke-width': 9, 'stroke-linecap': 'round', opacity: 0 }, s);
    const b1 = E('circle', { r: 11, cx: 90, cy: 18, fill: c }, s);
    const b2 = E('circle', { r: 9, cx: 118, cy: 55, fill: c, opacity: 0 }, s);
    return t => {
      const u = seg(t, 0, .42); b1.setAttribute('cy', 18 + (86.5 - 18) * u * u); h1.setAttribute('opacity', t >= .42 ? 1 : 0);
      const v = ease(seg(t, .5, .85)); b2.setAttribute('cx', 118 + (162.5 - 118) * v); b2.setAttribute('opacity', t >= .45 ? 1 : 0); h2.setAttribute('opacity', t >= .85 ? 1 : 0);
    };
  },
  at(s, c){
    E('line', { x1: 15, y1: 98, x2: 185, y2: 98, stroke: INK, 'stroke-width': 4, 'stroke-linecap': 'round' }, s);
    [40, 70, 100, 160].forEach(x => E('circle', { cx: x, cy: 98, r: 3.5, fill: FAINT }, s));
    const ring = E('circle', { cx: 130, cy: 98, r: 70, fill: 'none', stroke: c, 'stroke-width': 3, 'stroke-dasharray': '6 6' }, s);
    E('circle', { cx: 130, cy: 98, r: 5, fill: INK }, s);
    const stem = E('line', { x1: 130, y1: 84, x2: 130, y2: 97, stroke: c, 'stroke-width': 4, 'stroke-linecap': 'round', opacity: 0 }, s);
    const b = E('circle', { cx: 130, cy: 72, r: 0, fill: c }, s);
    return t => {
      ring.setAttribute('r', 70 - 58 * ease(seg(t, 0, .6))); ring.setAttribute('opacity', 1 - seg(t, .62, .85));
      const v = seg(t, .6, .82); b.setAttribute('r', 12 * v); stem.setAttribute('opacity', v);
    };
  },
  through(s, c){
    E('rect', { x: 65, y: 48, width: 70, height: 54, fill: c, opacity: .15 }, s);
    E('line', Object.assign({ x1: 15, y1: 75, x2: 185, y2: 75 }, DASH), s);
    const b = E('circle', { cx: 15, cy: 75, r: 11, fill: c }, s);
    E('line', Object.assign({ x1: 65, y1: 48, x2: 135, y2: 48 }, SW), s);
    E('line', Object.assign({ x1: 65, y1: 102, x2: 135, y2: 102 }, SW), s);
    return t => { b.setAttribute('cx', 15 + 170 * ease(seg(t, 0, .9))); };
  },
  across(s, c){
    E('rect', { x: 10, y: 44, width: 180, height: 50, fill: c, opacity: .15 }, s);
    E('line', Object.assign({ x1: 10, y1: 44, x2: 190, y2: 44 }, SW, { 'stroke-width': 4 }), s);
    E('line', Object.assign({ x1: 10, y1: 94, x2: 190, y2: 94 }, SW, { 'stroke-width': 4 }), s);
    E('line', Object.assign({ x1: 100, y1: 126, x2: 100, y2: 14 }, DASH), s);
    const b = E('circle', { cx: 100, cy: 126, r: 11, fill: c }, s);
    return t => { b.setAttribute('cy', 126 - 112 * ease(seg(t, 0, .85))); };
  },
  along(s, c){
    const f = x => 98 + 10 * Math.sin((x - 15) / 22);
    let d = '', d2 = '';
    for (let x = 15; x <= 185; x += 5) d += (x === 15 ? 'M' : 'L') + x + ' ' + f(x).toFixed(1) + ' ';
    for (let x = 20; x <= 180; x += 5) d2 += (x === 20 ? 'M' : 'L') + x + ' ' + (f(x) - 20).toFixed(1) + ' ';
    E('path', Object.assign({ d }, SW), s);
    E('path', Object.assign({ d: d2 }, DASH), s);
    const b = E('circle', { r: 10, cx: 20, cy: f(20) - 20, fill: c }, s);
    return t => { const x = 20 + 160 * ease(seg(t, 0, .95)); b.setAttribute('cx', x); b.setAttribute('cy', f(x) - 20); };
  },
  around(s, c){
    E('circle', Object.assign({ cx: 100, cy: 70, r: 46 }, DASH), s);
    E('rect', { x: 85, y: 55, width: 30, height: 30, rx: 5, fill: INK }, s);
    const b = E('circle', { r: 10, cx: 100, cy: 24, fill: c }, s);
    return t => { const a = -Math.PI / 2 + 2 * Math.PI * ease(seg(t, 0, .95)); b.setAttribute('cx', 100 + 46 * Math.cos(a)); b.setAttribute('cy', 70 + 46 * Math.sin(a)); };
  }
};
function makeDiagram(p, size){
  const wrap = document.createElement('div');
  wrap.className = 'dg ' + (size || 'big');
  wrap.style.setProperty('--c', col(p));
  const s = E('svg', { viewBox: '0 0 200 140', role: 'img', 'aria-label': p + ' のコアイメージ' });
  wrap.appendChild(s);
  if (size === 'big') { const h = document.createElement('span'); h.className = 'dg-hint'; h.textContent = 'タップでもう一度'; wrap.appendChild(h); }
  const up = SCENES[p] ? SCENES[p](s, col(p)) : null;
  let raf = 0;
  function play(){
    if (!up) return; cancelAnimationFrame(raf);
    if (RM) { up(1); return; }
    const st = performance.now(), d = 2000;
    const f = n => { const t = Math.min(1, (n - st) / d); up(t); if (t < 1) raf = requestAnimationFrame(f); };
    up(0); raf = requestAnimationFrame(f);
  }
  if (up) up(RM ? 1 : 0);
  wrap.addEventListener('click', e => { e.stopPropagation(); play(); });
  wrap.play = play;
  return wrap;
}
function mountDiagrams(root){
  (root || app).querySelectorAll('[data-dg]').forEach(ph => {
    const d = makeDiagram(ph.dataset.dg, ph.dataset.size || 'mini');
    ph.replaceWith(d); setTimeout(d.play, 200);
  });
}

const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
let parts = [], confRaf = 0;
function confetti(n){
  if (RM) return;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const cols = ['#E1563F', '#E2A93B', '#4E9C82', '#4C5FD5', '#F3ECD9', '#D23C7A'];
  for (let i = 0; i < n; i++) parts.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4, r: Math.random() * 6, w: 6 + Math.random() * 8, c: cols[i % cols.length], vr: (Math.random() - .5) * .3 });
  if (!confRaf) tick();
}
function tick(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy * devicePixelRatio; p.vy += .05; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); cx.restore(); });
  parts = parts.filter(p => p.y < cv.height + 30);
  confRaf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!parts.length) cx.clearRect(0, 0, cv.width, cv.height);
}

/* ===== 学習の流れ ===== */
function goStep(gi, si, review){
  const g = GROUPS[gi], st = stepsOf(g), step = st[si];
  if (!review) { S.pos = { g: gi, s: si }; save(); }
  const next = () => {
    if (review) {
      // コアイメージから入った復習は、そのまま用法まで見る
      if (step.k === 'core') return goStep(gi, si + 1, true);
      return groupMenu(gi);
    }
    goStep(gi, si + 1, false);
  };
  const back = review ? () => groupMenu(gi) : home;
  const title = g.title;
  if (step.k === 'core') return coreScreen(step.p, title, next, back);
  if (step.k === 'use') return runDeck({ title, back, cards: PREPS[step.p].uses.map((_, i) => ({ kind: 'use', p: step.p, i })), onDone: next });
  if (step.k === 'mix') return runQuiz({
    title: title + '・混合問題', back,
    items: shuffle(g.mix).map(q => ({ q, choices: g.preps })),
    onFirst: (it, ok) => { if (!ok) addWeak('q:' + it.q.id); },
    onDone: res => mixResult(gi, res, next, back)
  });
  if (step.k === 'pv') {
    const cards = []; g.preps.forEach(p => PREPS[p].pvs.forEach((_, i) => cards.push({ kind: 'pv', p, i })));
    return runDeck({ title: title + '・句動詞', back, cards, onDone: next });
  }
  if (step.k === 'pvq') return runQuiz({
    title: title + '・句動詞チェック', back,
    items: shuffle(g.pvq).map(q => ({ q, choices: g.preps })),
    onFirst: (it, ok) => { if (!ok) addWeak('q:' + it.q.id); },
    onDone: res => pvqResult(gi, res, next, back)
  });
  if (step.k === 'end') return groupEnd(gi, review);
}

      '<div class="card deck" id="card" role="button" tabindex="0">' + front + '</div>' +

    const card = document.getElementById('card');
    const flip = () => {

      const why = d.idiom ? '<p class="why"><span class="tag">慣用表現</span></p>'
        : '<div class="why-wrap"><div data-dg="' + c.p + '"></div><p class="why"><b class="hl" style="--c:' + col(c.p) + '">' + c.p + '</b>＝' + PREPS[c.p].core + '<br>' + d.why + '</p></div>';
      card.insertAdjacentHTML('beforeend',
        '<div class="back-face">' +
          (pv ? '<div class="mean">' + d.mean + '</div>' : '') +
          '<p class="ja">' + d.ja + '</p>' + why + cmpBox(d.cmp) +
        '</div>');
      card.classList.add('open');
      mountDiagrams(card);
      document.getElementById('evals').innerHTML = '<div class="evals"><button class="btn ng" id="no">わからなかった</button><button class="btn ok" id="yes">わかった</button></div>';
      const key = c.kind + ':' + c.p + ':' + c.i;
      const ev = ok => {
        const first = !seen.has(key); seen.add(key);
        if (onEval) onEval(c, ok, first);
        else if (!ok && first) addWeak((c.kind === 'use' ? 'u:' : 'p:') + c.p + ':' + c.i);
        if (!ok) list.push(c);
        i++; show();
      };
      document.getElementById('yes').onclick = () => ev(true);
      document.getElementById('no').onclick = () => ev(false);
    };
    card.onclick = flip;
    card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
  }
  show();
}

/* ===== 問題 ===== */
function runQuiz({ title, back, items, onFirst, onDone }){
  let list = items.slice(), i = 0, retry = [], phase = 1, firstOK = 0;
  const total = items.length, t0 = Date.now();
  function show(){
    if (i >= list.length) {
      if (retry.length) { list = retry; retry = []; i = 0; phase++; toast('まちがえた問題をもう一度'); }
      else return onDone({ firstOK, total, ms: Date.now() - t0 });
    }
    const it = list[i], q = it.q, tf = q.type === 'tf';
    const label = tf ? 'この英文は正しい？' : '空所に入るのは？';
    screen(title,
      '<div class="qmeta"><span>' + (phase > 1 ? 'もう一度・' : '') + (i + 1) + ' / ' + list.length + '</span><span>' + (q.kind === 'pvq' ? '句動詞' : '') + '</span></div>' +
      '<div class="card q"><div class="eyebrow">' + label + '</div>' +
        '<p class="sent big">' + (tf ? tfShow(q.s) : blankS(q.s)) + '</p>' +
        (q.ja ? '<p class="qja">' + q.ja + '</p>' : '') +
      '</div>' +
      '<div class="choices" id="ch"></div><div id="fb"></div>', back);
    const ch = document.getElementById('ch');
    const answer = (ok, note) => {
      if (phase === 1) { if (ok) firstOK++; if (onFirst) onFirst(it, ok); }
      if (!ok) retry.push(it);
      setStreak(ok);
      feedback(q, ok, note, () => { i++; show(); });
    };
    const choiceBtns = (opts, onPick) => {
      ch.className = 'choices n' + opts.length;
      ch.innerHTML = opts.map(o => '<button class="choice" data-o="' + o + '" style="--c:' + col(o) + '">' + o + '</button>').join('');
      ch.querySelectorAll('.choice').forEach(b => b.onclick = () => onPick(b.dataset.o, b));
    };
    const lock = (correct, picked) => {
      ch.querySelectorAll('button').forEach(b => {
        b.disabled = true;
        if (b.dataset.o === correct) b.classList.add('is-ok');
        else if (b === picked) b.classList.add('is-ng');
      });
    };
    if (!tf) {
      choiceBtns(it.choices, (o, b) => { lock(q.a, b); answer(o === q.a); });
    } else {
      const wrong = tfWrong(q);
      ch.className = 'choices n2';
      ch.innerHTML = '<button class="choice tf" data-o="ok">○ 正しい</button><button class="choice tf" data-o="ng">× まちがい</button>';
      ch.querySelectorAll('.choice').forEach(b => b.onclick = () => {
        const sayOk = b.dataset.o === 'ok';
        if (sayOk) { lock(q.ok ? 'ok' : 'ng', b); return answer(q.ok, q.ok ? '' : '「' + wrong + '」はまちがい。正しくは ' + q.a + '。'); }
        if (q.ok) { lock('ok', b); return answer(false, 'この英文は正しい文でした。'); }
        // まちがいを見抜けた → 正しい前置詞を選ぶ
        lock('ng', null);
        const step2 = document.createElement('div');
        step2.className = 'step2';
        step2.innerHTML = '<div class="eyebrow">正しい前置詞は？</div><div class="choices" id="ch2"></div>';
        ch.after(step2);
        const ch2 = step2.querySelector('#ch2');
        const opts = GROUPS[q.g].preps.filter(p => p !== wrong);
        ch2.className = 'choices n' + opts.length;
        ch2.innerHTML = opts.map(o => '<button class="choice" data-o="' + o + '" style="--c:' + col(o) + '">' + o + '</button>').join('');
        ch2.querySelectorAll('.choice').forEach(bb => bb.onclick = () => {
          ch2.querySelectorAll('button').forEach(x => { x.disabled = true; if (x.dataset.o === q.a) x.classList.add('is-ok'); else if (x === bb) x.classList.add('is-ng'); });
          const ok = bb.dataset.o === q.a;
          answer(ok, ok ? '' : 'まちがいには気づけました。正しくは ' + q.a + '。');
        });
      });
    }
  }
  show();
}
function feedback(q, ok, note, next){
  const fb = document.getElementById('fb');
  const sent = q.type === 'tf' ? tfFixed(q) : filledS(q.s, q.a);
  const why = q.idiom ? '<p class="why"><span class="tag">慣用表現</span></p>'
    : '<div class="why-wrap"><div data-dg="' + q.a + '"></div><p class="why"><b class="hl" style="--c:' + col(q.a) + '">' + q.a + '</b>＝' + PREPS[q.a].core + '<br>' + q.why + '</p></div>';
  fb.innerHTML = '<div class="fb ' + (ok ? 'ok' : 'ng') + '">' +
    '<div class="verdict">' + (ok ? '正解！' : 'ざんねん') + '</div>' +
    (note ? '<p class="note">' + note + '</p>' : '') +
    '<div class="fb-sent"><p class="sent">' + sent + '</p>' + sayBtn(plain(q)) + '</div>' +
    why + cmpBox(q.cmp) + '<button class="btn primary" id="next">次へ →</button></div>';
  mountDiagrams(fb);
  document.getElementById('next').onclick = next;
  setTimeout(() => fb.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }), 60);
}

/* ===== 結果 ===== */
function scoreBlock(res){
  const pct = res.firstOK / res.total;
  return '<div class="score"><div class="score-n">' + Math.round(pct * 100) + '<small>%</small></div><div class="score-s">1回目で正解 ' + res.firstOK + ' / ' + res.total + ' 問</div></div>';
}
function mixResult(gi, res, next, back){
  const g = GROUPS[gi], r = G(g.id), pct = res.firstOK / res.total;
  r.mixDone = true; r.best = Math.max(r.best, pct); save();
  const newPass = checkPass(g);
  let msg;
  if (newPass) msg = passBig(g);
  else if (r.passed) msg = '<p class="lead">合格済みです。</p>';
  else if (pct >= PASS) msg = '<p class="lead">合格ライン（8割）クリア！ このあと句動詞チェックまで終えると合格です。</p>';
  else msg = '<p class="lead">合格ラインは8割です。まちがえた問題は苦手リストに入りました。目次からいつでも再挑戦できます。</p>';
  screen(g.title + '・混合問題', '<div class="card result">' + scoreBlock(res) + msg + '</div><button class="btn primary" id="go">次へ →</button>', back);
  if (newPass) { confetti(140); }
  document.getElementById('go').onclick = next;
}
function pvqResult(gi, res, next, back){
  const g = GROUPS[gi], r = G(g.id);
  r.pvqDone = true; save();
  const newPass = checkPass(g);
  let msg = '<p class="lead">' + (res.firstOK === res.total ? '全問正解！' : 'まちがえた問題は苦手リストに入りました。') + '</p>';
  if (newPass) msg += passBig(g);
  else if (!r.passed) msg += '<p class="lead">混合問題で8割以上を取ると合格です。目次から再挑戦できます。</p>';
  screen(g.title + '・句動詞チェック', '<div class="card result">' + scoreBlock(res) + msg + '</div><button class="btn primary" id="go">次へ →</button>', back);
  if (newPass) confetti(140); else if (res.firstOK === res.total) confetti(60);
  document.getElementById('go').onclick = next;
}
function simpleResult(name, res, next, back){
  screen(name, '<div class="card result">' + scoreBlock(res) + '<p class="lead">' + (res.firstOK === res.total ? '全問正解！' : 'まちがえた問題は苦手リストに入りました。') + '</p></div><button class="btn primary" id="go">次へ →</button>', back);
  if (res.firstOK === res.total) confetti(60);
  document.getElementById('go').onclick = next;
}
function groupEnd(gi, review){
  const g = GROUPS[gi], r = G(g.id);
  r.done = true; save();
  const last = gi + 1 >= GROUPS.length;
  if (!review) { S.pos = { g: gi + 1, s: 0 }; save(); }
  screen(g.title,
    '<div class="card result"><div class="eyebrow">グループ完了</div><h2 class="end-t">' + g.title + '</h2>' + chips(g.preps) +
    '<p class="lead">' + (r.passed ? '合格済みです。' : (g.pvq.length ? 'まだ合格していません。合格は「混合問題で8割以上」＋「句動詞チェックを最後まで終える」です。目次から再挑戦できます。' : 'まだ合格していません。混合問題で8割以上を取ると合格です。目次から再挑戦できます。')) + '</p></div>' +
    (last ? '<button class="btn primary" id="go">ホームへ</button>' : '<button class="btn primary" id="go">次のグループへ →</button><button class="btn ghost" id="hm">ホームへ</button>'), home);
  document.getElementById('go').onclick = last ? home : () => goStep(gi + 1, 0, false);
  const hm = document.getElementById('hm'); if (hm) hm.onclick = home;
}

/* ===== 苦手リスト ===== */
function weakSession(){
  const due = shuffle(weakDue());
  if (!due.length) return home();
  const cards = [], qs = [];
  due.forEach(id => {
    const [t, a, b] = id.split(':');
    if (t === 'q' && QIDX[a]) qs.push({ q: QIDX[a], choices: GROUPS[QIDX[a].g].preps, wid: id });
    else if ((t === 'u' || t === 'p') && PREPS[a]) cards.push({ kind: t === 'u' ? 'use' : 'pv', p: a, i: +b, wid: id });
  });
  let grad = 0;
  const finish = () => {
    screen('苦手リスト', '<div class="card result"><div class="eyebrow">今日の苦手リスト 完了</div><div class="score"><div class="score-n">' + due.length + '<small>問</small></div><div class="score-s">' + (grad ? '<b>' + grad + '</b> 問が3回連続正解で卒業しました' : '3回連続正解で卒業です') + '</div></div><p class="lead">残りは明日以降また出題されます（全 ' + weakIds().length + ' 問）。</p></div><button class="btn primary" id="go">ホームへ</button>', home);
    if (grad) confetti(50);
    document.getElementById('go').onclick = home;
  };
  const doQs = () => qs.length ? runQuiz({ title: '苦手リスト', back: home, items: qs, onFirst: (it, ok) => { if (updWeak(it.wid, ok)) grad++; }, onDone: finish }) : finish();
  if (cards.length) runDeck({ title: '苦手リスト', back: home, cards, onEval: (c, ok, first) => { if (first && updWeak(c.wid, ok)) grad++; }, onDone: doQs });
  else doQs();
}

/* ===== 総仕上げ / 腕試し ===== */
function finalTest(){
  const ap = allPassed();
  const gs = ap ? GROUPS : GROUPS.filter(gDone);
  if (!gs.length) return;
  const pool = [];
  gs.forEach(g => { g.mix.forEach(q => { if (q.type === 'fill') pool.push(q); }); g.pvq.forEach(q => pool.push(q)); });
  const qs = shuffle(pool).slice(0, 20).map(q => ({ q, choices: shuffle([q.a].concat(shuffle(q.x).slice(0, 3))) }));
  const mode = ap ? 'full' : 'try', name = ap ? '総仕上げテスト' : '腕試し';
  screen(name,
    '<div class="card result"><div class="eyebrow">' + name + '</div><h2 class="end-t">' + qs.length + '問・4択</h2>' + chips(gs.reduce((a, g) => a.concat(g.preps), [])) +
    '<p class="lead">グループをまたいだ選択肢から選びます。正答率（1回目）と所要時間を記録します。</p>' +
    (S.best[mode] ? '<p class="muted">自己ベスト ' + Math.round(S.best[mode].pct * 100) + '%・' + fmtTime(S.best[mode].ms) + '</p>' : '') +
    '</div><button class="btn primary" id="go">スタート</button>', home);
  document.getElementById('go').onclick = () => runQuiz({
    title: name, back: home, items: qs,
    onFirst: (it, ok) => { if (!ok) addWeak('q:' + it.q.id); },
    onDone: res => {
      const pct = res.firstOK / res.total, b = S.best[mode];
      const nb = !b || pct > b.pct || (pct === b.pct && res.ms < b.ms);
      if (nb) { S.best[mode] = { pct, ms: res.ms, n: res.total }; save(); }
      screen(name, '<div class="card result">' + scoreBlock(res) + '<p class="time">所要時間 ' + fmtTime(res.ms) + '</p>' +
        (nb ? '<p class="newbest">自己ベスト更新！</p>' : '<p class="muted">自己ベスト ' + Math.round(b.pct * 100) + '%・' + fmtTime(b.ms) + '</p>') +
        '</div><button class="btn primary" id="go">ホームへ</button>', home);
      if (nb) confetti(120);
      document.getElementById('go').onclick = home;
    }
  });
}
